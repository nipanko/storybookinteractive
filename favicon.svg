  <line x1="16" y1="32" x2="28" y2="32" stroke="#FFC857" stroke-width="1.5" opacity="0.3"/>
  <line x1="16" y1="38" x2="24" y2="38" stroke="#FFC857" stroke-width="1.5" opacity="0.3"/>
  <!-- Star emerging -->
  <polygon points="44,8 46,14 52,14 47,18 49,24 44,20 39,24 41,18 36,14 42,14" fill="#FFC857"/>
  <!-- Small sparkles -->
